<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cacutie Style | Your Style, Your Story.</title>
<meta name="description" content="Cacutie Style: toko fashion online untuk wanita, pria, dan aksesori.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="skip" id="skip" type="button">Lewati ke konten</button>

<!-- 1) GERBANG: tiga pilihan saat tautan dibuka -->
<section id="gate" class="gate" hidden aria-labelledby="gTitle">
  <div class="box">
    <img src="assets/logo.svg" width="96" height="96" alt="Logo Cacutie Style">
    <h1 id="gTitle">Cacutie Style</h1>
    <p class="muted" style="font-size:1.05rem">Your Style, Your Story.</p>
    <div class="gopts">
      <button class="gopt" id="gGuest" type="button"><b>Masuk sebagai Tamu</b><span>Langsung belanja tanpa akun</span></button>
      <button class="gopt" id="gAcct" type="button"><b>Login / Buat Akun</b><span id="gAcctSub">Pesan lebih cepat dan lihat riwayat pesananmu</span></button>
      <button class="gopt" id="gAdmin" type="button"><b>Login Admin</b><span>Kelola produk, pesanan, dan toko</span></button>
    </div>
  </div>
</section>

<!-- 2) TOKO PELANGGAN -->
<div id="shop" hidden>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#/" aria-label="Cacutie Style, ke beranda"><img src="assets/logo.svg" alt=""><span class="lt">Cacutie Style<small>Your Style, Your Story.</small></span></a>
      <nav class="main" id="nav" aria-label="Menu utama">
        <a href="#/" data-r="home">Beranda</a>
        <a href="#/produk" data-r="produk">Semua Produk</a>
        <a href="#/produk?kat=Wanita">Wanita</a>
        <a href="#/produk?kat=Pria">Pria</a>
        <a href="#/produk?kat=Aksesori">Aksesori</a>
        <a href="#/lacak" data-r="lacak">Lacak Pesanan</a>
        <a href="#/faq" data-r="faq">Bantuan</a>
        <a href="#/masuk" id="navAcct" data-r="masuk">Masuk / Daftar</a>
        <a href="#" id="navGate">Ganti mode</a>
      </nav>
      <div class="actions">
        <button class="icon-btn" id="btnSearch" aria-label="Cari produk" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <a class="icon-btn" href="#/keranjang" aria-label="Keranjang belanja">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 016 0"/></svg>
          <span class="badge" id="cartCount" hidden>0</span>
        </a>
        <button class="icon-btn burger" id="btnMenu" aria-label="Buka menu" aria-expanded="false" aria-controls="nav">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <div class="searchbar" id="searchbar">
      <form id="searchForm" role="search">
        <label class="sr" for="q">Cari produk</label>
        <input id="q" type="search" placeholder="Cari nama produk atau SKU" autocomplete="off">
        <button class="btn" type="submit">Cari</button>
      </form>
    </div>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
</div>

<!-- 3) PANEL ADMIN (tautan yang sama) -->
<div id="admin" hidden>
<header class="top"><div class="wrap"><div class="bar">
  <span class="logo"><img src="assets/logo.svg" alt=""><span class="lt">Cacutie Style<small>Panel admin</small></span></span>
  <nav class="main" style="margin-left:auto;display:flex;position:static;padding:0;border:0;background:none;flex-direction:row">
    <button class="btn sm ghost" id="admShop" type="button">Lihat toko</button>
    <button class="btn sm ghost" id="admGate" type="button">Ganti mode</button>
    <button class="btn sm" id="logout" type="button" hidden>Keluar</button>
  </nav>
</div></div></header>
<main class="wrap" id="adm" tabindex="-1" style="min-height:60vh"></main>
</div>

<dialog id="dlg" aria-modal="true"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>
</body>
</html>
